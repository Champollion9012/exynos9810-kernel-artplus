name: Compile Kernel

# Triggers: Run on push or manually via the Actions tab
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install necessary dependencies for kernel compilation
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev
    # 3. Install Compiler
    - name: Setup Toolchain (Clang 20 r547379)
      run: |
        echo "Setting up Clang 20..."
        # Create directory one level up as expected by apollo.sh
        mkdir -p ../compiler
        
        # Download Clang 20 archive
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
        
        # Create the specific directory the script looks for (Option 4)
        mkdir -p ../compiler/clang-20.0.0-r547379
        
        # Extract
        tar -xf clang.tar.gz -C ../compiler/clang-20.0.0-r547379
        echo "Toolchain ready."

    # 4. Run the build script
    - name: Run build_s9plus_kernel.sh
      id: build_kernel
      run: |
        # Ensure the script is executable
        chmod +x build_s9plus_kernel.sh
        
        # Run the script and pipe output to both console and log file
        echo "Starting build process..."
        ./build_s9plus_kernel.sh 2>&1 | tee build.log

    # 4. Upload the build log for debugging
    - name: Upload Build Log
      if: always() # Upload log even if the build fails
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # 5. Upload the compiled kernel files
    # Note: Verify the 'path' matches where your script outputs the files.
    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: exynos9810-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/dtbo.img
          *.zip
